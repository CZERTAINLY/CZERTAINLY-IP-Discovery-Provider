discovery:
  buffer:
    # The undrained results of the live runs on this node. Production blocks when a bound is reached rather than
    # dropping items, which is safe because Core drains from initiate onward; a wait longer than
    # backpressure-wait-ms fails the run naming the bound it hit. All must be positive.
    max-runs: ${DISCOVERY_BUFFER_MAX_RUNS:8}
    max-items-per-run: ${DISCOVERY_BUFFER_MAX_ITEMS_PER_RUN:50000}
    max-bytes-per-run: ${DISCOVERY_BUFFER_MAX_BYTES_PER_RUN:134217728}
    max-total-bytes: ${DISCOVERY_BUFFER_MAX_TOTAL_BYTES:536870912}
    backpressure-wait-ms: ${DISCOVERY_BUFFER_BACKPRESSURE_WAIT_MS:120000}
  portOptions: No, Yes
  supportedTypes: IP, Range, Subnet
server:
  port: ${PORT:8080}
spring:
  datasource:
    auto-commit: false
    driver-class-name: org.h2.Driver
    password:
    url: jdbc:h2:mem:HCE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
  flyway:
    enabled: false

# This file shadows the shipped application.yml rather than extending it, so the metrics wiring has to be repeated
# here for MetricsEndpointTest to have an endpoint to scrape. Keep the two in step.
management:
  endpoints:
    web:
      base-path: '/'
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: v1/metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s
